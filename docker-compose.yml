services:
  api:
    build:
      context: .
      target: runner
    image: my-image:prod
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_URL: postgres://app_user@postgres:5432/marketplace
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: first-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d marketplace" ]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"