services:
  api:
    build:
      context: .
      target: runner
    image: my-image:prod
    profiles: ["app"]
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_URL: postgres://app_user@pgbouncer:6432/marketplace
      BROKER_URL: amqp://app_user:first-pass@rabbitmq:5672
      REDIS_URL: redis://redis-cache:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: first-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d marketplace" ]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=first-pass psql -h 127.0.0.1 -p 6432 -U app_user -d pgbouncer -Atc 'SHOW VERSION' > /dev/null" ]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      RABBITMQ_DEFAULT_USER: app_user
      RABBITMQ_DEFAULT_PASS: first-pass
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]
      interval: 5s
      timeout: 10s
      retries: 24
    ports:
      - "5672:5672"
      - "15672:15672"

  redis-cache:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6390:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-queue:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "6391:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 3s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    environment:
      PACT_BROKER_DATABASE_ADAPTER: sqlite
      PACT_BROKER_DATABASE_NAME: /tmp/pact_broker.sqlite
      PACT_BROKER_PORT: 9292
    ports:
      - "9292:9292"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat > /dev/null" ]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  redis-queue-data: