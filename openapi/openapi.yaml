openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: API for the Marketplace application

servers:
  - url: http://localhost:5000

security: [ ]

paths:
  /products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of products to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque token used to retrieve the next page of products.
          schema:
            type: string
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createProduct
      summary: Create a product
      security:
        - bearerAuth: [ ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: The same key with the same request body must return the same response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduct'
      responses:
        '201':
          description: Product created successfully
          headers:
            Idempotency-Replay:
              description: Indicates that the response was returned from a previous request with the same Idempotency-Key and request body.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Only a seller or an admin can create products
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Idempotency key was reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{id}:
    get:
      operationId: getProductCard
      summary: Get a product card with the number of units sold

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the product.
          schema:
            type: string
        - name: X-User-Id
          in: header
          required: false
          description: Identifier of the client for the rate limit. Without it the limit is counted per IP address.
          schema:
            type: string

      responses:
        '200':
          description: Product card retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCard'

        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The client exceeded the rate limit, or the rate limit store is unavailable
          headers:
            Retry-After:
              description: Number of seconds after which the request may be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The product card is still being loaded by another request
          headers:
            Retry-After:
              description: Number of seconds after which the request may be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    get:
      operationId: listOrders
      summary: List orders of the authenticated buyer
      security:
        - bearerAuth: [ ]

      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: cursor
          in: query
          required: false
          description: Opaque token used to retrieve the next page of orders.
          schema:
            type: string

      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'

        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createOrder
      summary: Create an order for the authenticated buyer
      security:
        - bearerAuth: [ ]

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: The same key with the same request body must return the same response.
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'

      responses:
        '201':
          description: Order created successfully
          headers:
            Idempotency-Replay:
              description: Indicates that the response was returned from a previous request with the same Idempotency-Key and request body.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: Product is out of stock or the buyer has insufficient funds
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: Idempotency key was reused with a different request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order of the authenticated buyer by ID
      security:
        - bearerAuth: [ ]

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string

      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The order belongs to another buyer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/status:
    patch:
      operationId: changeOrderStatus
      summary: Change the status of an order, seller or admin only
      security:
        - bearerAuth: [ ]

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOrderStatus'

      responses:
        '200':
          description: Order status changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Only a seller or an admin can change the order status
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The order cannot move from its current status to the requested one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{id}/events:
    get:
      operationId: streamOrderEvents
      summary: Stream order status changes as Server-Sent Events
      security:
        - bearerAuth: [ ]

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: Number of the last event the client has seen. Buffered events with a greater number are sent first; without the header only new events are sent.
          schema:
            type: string

      responses:
        '200':
          description: Stream of order.status events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The order belongs to another buyer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions:
    post:
      operationId: createSession
      summary: Start a session for a user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'

      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sessions/me:
    get:
      operationId: getCurrentSession
      summary: Read the current session and extend its lifetime

      parameters:
        - name: X-Session-Token
          in: header
          required: false
          description: Token returned by POST /sessions. Every successful read resets the session lifetime.
          schema:
            type: string

      responses:
        '200':
          description: Session is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: X-Session-Token header is missing or the session has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      operationId: login
      summary: Exchange email and password for an access and refresh token pair

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Credentials are valid, a new token family is started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Email or password is incorrect
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Rotate a refresh token and receive a new token pair

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'

      responses:
        '200':
          description: The presented refresh token is spent, a new pair from the same family is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Refresh token is unknown, expired, revoked or reused; a reuse revokes the whole family
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me:
    get:
      operationId: currentUser
      summary: Return the identity carried by the access token
      security:
        - bearerAuth: [ ]

      responses:
        '200':
          description: The access token is valid and not revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh token family and deny the current access token
      security:
        - bearerAuth: [ ]

      responses:
        '204':
          description: The refresh token family is revoked and the access token is on the denylist until it expires
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Logout could not be completed, the request can be retried
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /uploads/intent:
    post:
      operationId: createUploadIntent
      summary: Reserve an object key and return a presigned PUT for the bytes
      description: "The server generates the object key uploads/{userId}/{uuid}.{ext}; the filename from the client never reaches the key. The bytes go straight to the storage with the returned URL, the API does not proxy them."
      security:
        - bearerAuth: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'

      responses:
        '200':
          description: A PENDING file row exists and the presigned PUT is valid for expires_in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          description: The body violates the contract, for example the content type is not allowed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /uploads/commit:
    post:
      operationId: commitUpload
      summary: Confirm with HeadObject that the bytes are in the storage and mark the file COMPLETED
      security:
        - bearerAuth: [ ]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCommitRequest'

      responses:
        '200':
          description: The object exists with the declared size, the file is COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: The body violates the contract
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The file belongs to another user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: File not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The storage has no object for this file yet, or its size differs from the declared one
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /uploads/{id}/parts:
    get:
      operationId: resumeMultipartUpload
      summary: Ask the storage with ListParts which parts are uploaded and sign URLs only for the missing ones
      description: "A new process after a broken upload calls this, uploads only the parts listed in upload.parts, then calls commit. At most 100 URLs come back at once; the client calls again for the rest."
      security:
        - bearerAuth: [ ]

      parameters:
        - name: id
          in: path
          required: true
          description: file_id returned by the intent.
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Uploaded part numbers and presigned URLs for the missing parts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          description: The id is not a uuid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, malformed, expired, signed by another key or revoked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The file belongs to another user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: File not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The file is already completed or is uploaded with a single PUT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The revocation list is unavailable, the request is refused
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price_cents
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
    ProductCard:
      type: object
      required:
        - id
        - name
        - price_cents
        - stock
        - units_sold
      properties:
        id:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        units_sold:
          type: integer
          minimum: 0
          description: Number of units sold in paid orders.
    ProductList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: string
          nullable: true
    CreateProduct:
      type: object
      additionalProperties: false
      required:
        - name
        - price_cents
      properties:
        name:
          type: string
        price_cents:
          type: integer
          minimum: 0
        description:
          type: string
        stock:
          type: integer
          minimum: 0
    OrderList:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        next_cursor:
          type: string
          nullable: true
    Order:
      type: object
      required:
        - id
        - user_id
        - created_at
        - status
        - items
        - total_cents
      properties:
        id:
          type: string
          description: Unique order identifier.
        user_id:
          type: string
          description: Identifier of the buyer who owns the order.
        created_at:
          type: string
          format: date-time
          description: Date and time when the order was created.
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          minimum: 0
          description: Total order amount in cents.
    OrderItem:
      type: object
      required:
        - product_id
        - quantity
        - price_cents
      properties:
        product_id:
          type: string
          description: Identifier of the ordered product.
        quantity:
          type: integer
          minimum: 1
          description: Number of products ordered.
        price_cents:
          type: integer
          minimum: 0
          description: Product price in cents at the time of ordering.
    CreateOrder:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    CreateOrderItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
    ChangeOrderStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
    CreateSession:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Identifier of the user who starts the session.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPair:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
      properties:
        access_token:
          type: string
          description: 'ES256-signed JWT to send in the Authorization header as Bearer <token>.'
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Lifetime of the access token in seconds.
        refresh_token:
          type: string
          description: 'Opaque single-use token for POST /auth/refresh.'
    CurrentUser:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - buyer
            - seller
            - admin
    Session:
      type: object
      required:
        - token
        - user_id
        - created_at
      properties:
        token:
          type: string
          description: Session token to send in the X-Session-Token header.
        user_id:
          type: string
          description: Identifier of the session owner.
        created_at:
          type: string
          format: date-time
          description: Date and time when the session was started.
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required:
        - filename
        - content_type
        - size
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Name shown to the user. It is never used in the object key.
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
            - application/gzip
        size:
          type: integer
          minimum: 1
          maximum: 5368709120
          description: Exact size of the file in bytes; commit compares it with HeadObject.
    UploadCommitRequest:
      type: object
      additionalProperties: false
      required:
        - file_id
      properties:
        file_id:
          type: string
          format: uuid
    File:
      type: object
      required:
        - file_id
        - key
        - status
        - content_type
        - size
        - created_at
        - completed_at
      properties:
        file_id:
          type: string
          format: uuid
        key:
          type: string
          description: Object key generated by the server.
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
        content_type:
          type: string
        size:
          type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    UploadIntent:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          required:
            - upload
          properties:
            upload:
              oneOf:
                - $ref: '#/components/schemas/SingleUpload'
                - $ref: '#/components/schemas/MultipartUpload'
              discriminator:
                propertyName: mode
                mapping:
                  single: '#/components/schemas/SingleUpload'
                  multipart: '#/components/schemas/MultipartUpload'
    SingleUpload:
      type: object
      required:
        - mode
        - method
        - url
        - headers
        - expires_in
      properties:
        mode:
          type: string
          enum:
            - single
        method:
          type: string
          enum:
            - PUT
        url:
          type: string
          format: uri
          description: Presigned URL. It is a bearer of access until it expires, so it is never logged.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must send, they are part of the signature.
        expires_in:
          type: integer
          description: Lifetime of the URL in seconds.
    MultipartUpload:
      type: object
      required:
        - mode
        - part_size
        - part_count
        - uploaded
        - parts
        - expires_in
      properties:
        mode:
          type: string
          enum:
            - multipart
        part_size:
          type: integer
          description: "max(5 MiB, size / 10000 rounded up to MiB); every part except the last has exactly this size."
        part_count:
          type: integer
        uploaded:
          type: array
          items:
            type: integer
          description: Part numbers the storage already holds with the expected size, from ListParts.
        parts:
          type: array
          description: Presigned PUT URLs for missing parts, at most 100 at once.
          items:
            type: object
            required:
              - part_number
              - method
              - url
            properties:
              part_number:
                type: integer
              method:
                type: string
                enum:
                  - PUT
              url:
                type: string
                format: uri
        expires_in:
          type: integer
          description: Lifetime of the part URLs in seconds.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the type of problem.
        title:
          type: string
          description: Short human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri-reference
          description: URI identifying the specific occurrence of the problem.