name: image-scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build secret for the image
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '%s' "${NPM_TOKEN:-ci-placeholder-token}" > .npm_token

      - name: Build the production image
        run: npm run image:build

      - name: Scan with the working threshold
        run: npm run scan
        env:
          SCAN_SEVERITY: HIGH,CRITICAL
          SCAN_MAX: 20
