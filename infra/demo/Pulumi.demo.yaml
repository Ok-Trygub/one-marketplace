config:
  aws:region: eu-central-1
  aws:defaultTags:
    tags:
      Project: nodejs-pro-hw31
      Stack: demo
      ManagedBy: pulumi
  aws:skipCredentialsValidation: "true"
  aws:skipRequestingAccountId: "true"
  aws:skipMetadataApiCheck: "true"
  aws:s3UsePathStyle: "true"
  aws:endpoints:
    - ec2: http://localhost:23166
      iam: http://localhost:23166
      sts: http://localhost:23166
      rds: http://localhost:23166
      elbv2: http://localhost:23166
      lambda: http://localhost:23166
      resourcegroupstaggingapi: http://localhost:23166
  hw31:withNat: "false"
  one-marketplace-aws-demo:baseStack: organization/one-marketplace-aws-base/base
